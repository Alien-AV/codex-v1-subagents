name: Publish npm release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Check whether this version is already published
        id: package
        shell: pwsh
        run: |
          $name = node -p "require('./package.json').name"
          $version = node -p "require('./package.json').version"
          npm view "$name@$version" version --json *> $null
          $alreadyPublished = $LASTEXITCODE -eq 0
          $shouldPublish = if ($alreadyPublished) { "false" } else { "true" }
          "publish=$shouldPublish" >> $env:GITHUB_OUTPUT
          "Package: $name@$version; publish: $shouldPublish"
          exit 0
      - if: steps.package.outputs.publish == 'true'
        run: npm run check
      - if: steps.package.outputs.publish == 'true'
        run: npm test
      - if: steps.package.outputs.publish == 'true'
        run: npm publish --provenance --access public
